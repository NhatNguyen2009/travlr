<div class="row">
  <div class="col-12 col-md-8">
    <h2>Login</h2>
    <form (ngSubmit)="onLoginSubmit()">
      <div role="alert" *ngIf="formError" class="alert alert-danger">
        {{ formError }}
      </div>
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" name="name" [(ngModel)]="credentials.name" placeholder="Enter Name" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" name="email" [(ngModel)]="credentials.email" placeholder="Enter email address" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" name="password" [(ngModel)]="credentials.password" placeholder="Password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary">Sign In!</button>
    </form>
  </div>
</div>
